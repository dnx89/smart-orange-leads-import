services:
  app:
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - .:/var/www/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RUN_MIGRATIONS: "true"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      PHP_IDE_CONFIG: "serverName=leads-import"
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-leads_import}
      DB_USERNAME: ${DB_USERNAME:-leads}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-leads_import}
      MYSQL_USER: ${DB_USERNAME:-leads}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 60s

volumes:
  mysql_data:

